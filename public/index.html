<!DOCTYPE html>

    <style>

        .header { background-color: #2c3e50; color: white; padding: 1rem 0; text-align: center; }

        .cta { background-color: #3498db; color: white; padding: 30px 20px; text-align: center; }
        .cta a { background-color: #2980b9; color: white; text-decoration: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; }
