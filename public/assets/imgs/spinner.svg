<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>당말사 — Spinner (가속 + 루프)</title>

  <style>
    .ring, .bokV, .bokD {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    /* 총 주기: 2.5s
       - 0.00 ~ 1.30s: Design 가속 시퀀스 (ring → bokV → bokD)
       - 1.30 ~ 2.00s: 완성된 도장 홀드 (0.7s)
       - 2.00 ~ 2.50s: 페이드아웃 + 리셋 (0.5s)
    */
    .ring { animation: spin-ring 2.5s ease-out infinite; }
    .bokV { animation: spin-bokV 2.5s ease-out infinite; }
    .bokD { animation: spin-bokD 2.5s ease-out infinite; }

    @keyframes spin-ring {
      0%   { stroke-dashoffset: 100; opacity: 1; }
      32%  { stroke-dashoffset: 0; }    /* 0.80s draw */
      80%  { stroke-dashoffset: 0; opacity: 1; }  /* hold */
      100% { stroke-dashoffset: 0; opacity: 0; }  /* fade out */
    }
    @keyframes spin-bokV {
      0%, 30% { stroke-dashoffset: 100; opacity: 1; }  /* delay 0.75s */
      42%     { stroke-dashoffset: 0; }                /* 0.30s draw */
      80%     { stroke-dashoffset: 0; opacity: 1; }
      100%    { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes spin-bokD {
      0%, 42% { stroke-dashoffset: 100; opacity: 1; }  /* delay 1.05s */
      52%     { stroke-dashoffset: 0; }                /* 0.25s draw */
      80%     { stroke-dashoffset: 0; opacity: 1; }
      100%    { stroke-dashoffset: 0; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring, .bokV, .bokD {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <circle class="ring" pathLength="100" cx="32" cy="32" r="25" fill="none" stroke="#B8740C" stroke-width="6.5" stroke-linecap="butt" transform="rotate(-90 32 32)"/>
  <path class="bokV" pathLength="100" d="M 30 16 Q 29 32 30 48" fill="none" stroke="#B8740C" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
  <path class="bokD" pathLength="100" d="M 31 30 Q 37 34 42 38" fill="none" stroke="#B8740C" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
</svg>
