<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>정치 바로미터 — Splash (첫 진입 인트로)</title>

  <style>
    .ring, .bokV, .bokD {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    /* 한 번 그리고 완성 상태 유지 (fill-mode: forwards) */
    .ring { animation: ldDrawRing 0.80s ease-out forwards; }
    .bokV { animation: ldDrawBokV 0.30s ease-out 0.75s forwards; }
    .bokD { animation: ldDrawBokD 0.25s ease-out 1.05s forwards; }

    @keyframes ldDrawRing { to { stroke-dashoffset: 0; } }
    @keyframes ldDrawBokV { to { stroke-dashoffset: 0; } }
    @keyframes ldDrawBokD { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .ring, .bokV, .bokD {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <circle class="ring" pathLength="100" cx="32" cy="32" r="25" fill="none" stroke="#B8740C" stroke-width="6.5" stroke-linecap="round" transform="rotate(-90 32 32)"/>
  <path class="bokV" pathLength="100" d="M 30 16 Q 29 32 30 48" fill="none" stroke="#B8740C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="bokD" pathLength="100" d="M 31 30 Q 37 34 42 38" fill="none" stroke="#B8740C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
