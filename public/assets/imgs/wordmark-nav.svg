<?xml version="1.0" encoding="UTF-8"?>
<!--
  당말사 — Wordmark (nav/login 단일행, 태그라인 없음)
  마크를 앞에 두고 이 워드마크를 붙이는 구성. viewBox 를 잉크에 타이트하게 재단해서
  마크·구분선과의 간격이 CSS gap 값 그대로 나오게 함 (잉크 좌우 여백 각 1~3).

  textLength/lengthAdjust 는 필수:
  타이트 재단이라 폰트 폴백으로 글자가 넓어지면 그대로 잘림.
  (실측 잉크 우측 — Noto Serif KR 111.9 / sans-serif 106.2 / Batang 117.2 → viewBox 116 초과)
  advance 를 109.3 에 고정하면 어떤 폴백에서도 viewBox 안에 들어옴.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 46" width="116" height="46">
  <title>당말사</title>
  <text x="0" y="38"
        font-family="'Noto Serif KR', 'Nanum Myeongjo', serif" font-weight="900" font-size="40"
        letter-spacing="-2.2" textLength="109.3" lengthAdjust="spacingAndGlyphs"
        fill="#0F1B1F">당말사</text>
</svg>
