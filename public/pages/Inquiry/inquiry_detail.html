<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>견적 상세</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #eaf2f8; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #c9d8e0; border-radius: 8px; background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .detail-item { margin-bottom: 15px; }
        .detail-item strong { display: block; margin-bottom: 5px; color: #2e86c1; }
        .message-box { padding: 10px; background-color: #f0f8ff; border: 1px solid #c9d8e0; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>견적 상세</h2>
    <div id="inquiryDetails">
        </div>
    <br>
    <a href="inquiries.html">목록으로</a>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const inquiryId = urlParams.get('id');

        if (!inquiryId) {
            document.getElementById('inquiryDetails').innerHTML = '<p>유효한 문의 ID가 없습니다.</p>';
            return;
        }

        try {
            const response = await fetch(`/api/inquiries/${inquiryId}`);
            const inquiry = await response.json();

            if (inquiry) {
                const detailsDiv = document.getElementById('inquiryDetails');
                const date = new Date(inquiry.CREATED_AT).toLocaleString('ko-KR');
                
                detailsDiv.innerHTML = `
                    <div class="detail-item">
                        <strong>이름:</strong> ${inquiry.NAME}
                    </div>
                    <div class="detail-item">
                        <strong>이메일:</strong> ${inquiry.EMAIL}
                    </div>
                    <div class="detail-item">
                        <strong>전화번호:</strong> ${inquiry.PHONE}
                    </div>
                    <div class="detail-item">
                        <strong>문의 날짜:</strong> ${date}
                    </div>
                    <div class="detail-item">
                        <strong>문의 내용:</strong>
                        <div class="message-box">${inquiry.MESSAGE}</div>
                    </div>
                `;
            } else {
                document.getElementById('inquiryDetails').innerHTML = '<p>해당 문의를 찾을 수 없습니다.</p>';
            }

        } catch (error) {
            console.error('Error fetching inquiry details:', error);
            document.getElementById('inquiryDetails').innerHTML = '<p>데이터를 불러오는데 실패했습니다.</p>';
        }
    });
</script>

</body>
</html>
